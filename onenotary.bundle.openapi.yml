      type: object
      properties:
        id:
          type: string
          format: integer
        callback_url:
          type: string
          format: uri
        event:
          oneOf:
            - $ref: '#/components/schemas/session-status-updated'
            - $ref: '#/components/schemas/session-status-updated-to-specific'
            - $ref: '#/components/schemas/notary-changed'
            - $ref: '#/components/schemas/signer-lock'
            - $ref: '#/components/schemas/session-pause-av-issue'
            - $ref: '#/components/schemas/session-pause-document-issue'
            - $ref: '#/components/schemas/session-pause-notary-change'
            - $ref: '#/components/schemas/session-pause-notary-not-on-session'
            - $ref: '#/components/schemas/session-pause-participants-inactivity'
            - $ref: '#/components/schemas/session-pause-signer-exit-other-reason'
            - $ref: '#/components/schemas/session-pause-other-reason'
            - $ref: '#/components/schemas/session-terminate-with-reason'
