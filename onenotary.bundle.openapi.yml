  /subscribe:
    post:
      operationId: subscribeWebhook
      tags:
        - Webhook
      summary: Subscribe to the events
      description: Add subscription for events. **Contact support@onenotary.us for webhook setup**
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                callback_url:
                  type: string
                  format: uri
                  description: This URL will be called by the server when the desired event will occur
                events:
                  type: array
                  description: |
                    List of event names to subscribe to.

                    ### Webhook Events vs. Session Statuses
                    It is important to distinguish between **Webhook Event Types** (which you subscribe to) and **Session Statuses** (which represent the state of a session).

                    - **Webhook Event Types**: These are strings like `session.status.updated` or `session.status.updated_completed_successfully`. They define *when* a callback is sent.
                    - **Session Statuses**: These are strings like `created`, `ready_to_start`, or `completed_successfully`. They are found in the `status` field of the session object within the webhook payload.

                    ### Available Event Categories
                    - **Session Status Updates**: 
                      - `session.status.updated`: A generic event triggered on *any* status change.
                      - `session.status.updated_<STATUS>`: Specific events triggered only when the session enters a particular state (e.g., `session.status.updated_completed_successfully`).
                    - **Session Property Updates**: Triggered when specific session properties change, regardless of the overall session status.
                      - `session.updated_notary_assigned` / `session.updated_notary_removed`
                      - `session.updated_signer_identity_locked` / `session.updated_signer_identity_unlocked`
                    - **Session Pause Events**: Triggered when a session is paused for specific reasons (e.g., `session.updated_paused_audio_video_issue`). These events provide detailed context in the `pause_details` field.
                  items:
                    oneOf:
                      - $ref: '#/components/schemas/session-status-updated'
                      - $ref: '#/components/schemas/session-status-updated-to-specific'
                      - $ref: '#/components/schemas/notary-changed'
                      - $ref: '#/components/schemas/signer-lock'
                      - $ref: '#/components/schemas/session-pause-av-issue'
                      - $ref: '#/components/schemas/session-pause-document-issue'
                      - $ref: '#/components/schemas/session-pause-notary-change'
                      - $ref: '#/components/schemas/session-pause-notary-not-on-session'
                      - $ref: '#/components/schemas/session-pause-participants-inactivity'
                      - $ref: '#/components/schemas/session-pause-signer-exit-other-reason'
                      - $ref: '#/components/schemas/session-pause-other-reason'
                      - $ref: '#/components/schemas/session-terminate-with-reason'
              required:
                - callback_url
                - events
      responses:
        '201':
          description: Subscription added
      callbacks:
        session_status_updated:
          https://myserver.com/send/callback/here:
            post:
              summary: Session status was updated
              description: A callback triggered every time session status is updated
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/SessionStatusUpdated'
              responses:
                '200':
                  description: Callback successfully processed and no retries will be performed
                4XX:
                  description: Callback processing failed and retries will be performed
                5XX:
                  description: Callback processing failed and retries will be performed
        session_status_updated_to_specific:
          https://myserver.com/send/callback/here:
            post:
              summary: Session status was updated to a specific value
              description: A callback triggered every time status is updated to a specific value
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/SessionStatusUpdatedToSpecific'
              responses:
                '200':
                  description: Callback successfully processed and no retries will be performed
                4XX:
                  description: Callback processing failed and retries will be performed
                5XX:
                  description: Callback processing failed and retries will be performed
        notary_changed:
          https://myserver.com/send/callback/here:
            post:
              summary: Notary changed for the session
              description: A callback triggered every time a notary is either assigned to or removed from a session
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/NotaryChanged'
