              $ref: '#/components/schemas/ParticipantsObject'
    DetailsAVIssueObject:
      type: object
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantResponseBase'
    SessionPauseAVIssueObject:
      type: object
      properties:
        notary:
          $ref: '#/components/schemas/NotaryResponseBase'
        pause_details:
          $ref: '#/components/schemas/DetailsAVIssueObject'
    SessionPauseAVIssue:
      allOf:
        - $ref: '#/components/schemas/SessionUpdatedObject'
        - type: object
          properties:
            type:
              $ref: '#/components/schemas/session-pause-av-issue'
            data:
              $ref: '#/components/schemas/SessionPauseAVIssueObject'
    DetailsNotaryChangeObject:
      type: object
      properties:
        states:
          type: array
          items:
            type: string
