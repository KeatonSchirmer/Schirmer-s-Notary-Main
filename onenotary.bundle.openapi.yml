            $ref: '#/components/schemas/ParticipantResponseBase'
    SignerLockedUnlocked:
      allOf:
        - $ref: '#/components/schemas/SessionUpdatedObject'
        - type: object
          properties:
            type:
              $ref: '#/components/schemas/signer-lock'
