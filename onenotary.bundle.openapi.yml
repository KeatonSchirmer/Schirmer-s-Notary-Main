        languages:
          type: array
          items:
            type: string
            enum:
              - ES
    SessionPauseNotaryChangeObject:
      type: object
      properties:
        notary:
          $ref: '#/components/schemas/NotaryResponseBase'
        pause_details:
          $ref: '#/components/schemas/DetailsNotaryChangeObject'
    SessionPauseNotaryChange:
