  /webhooks:
    get:
      operationId: getWebhooks
      security:
        - Token: []
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X GET 'https://app.onenotary.us/api/v2/webhooks' \
            --header 'Accept: application/json' \
            --header 'X-ONENOTARY-API-TOKEN: {Business Account Token}' \
            --header 'Content-Type: application/json'
      tags:
        - Webhook
      summary: List of subscribed webhooks
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
  /webhooks/{webhook_id}:
    get:
      operationId: getWebhook
      security:
        - Token: []
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X GET 'https://app.onenotary.us/api/v2/webhooks/{webhook_id}' \
            --header 'Accept: application/json' \
            --header 'X-ONENOTARY-API-TOKEN: {Business Account Token}'
            --header 'Content-Type: application/json'
      tags:
        - Webhook
      summary: Get Webhook info
      parameters:
        - $ref: '#/components/parameters/webhook_id'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
    delete:
      operationId: deleteWebhook
      security:
        - Token: []
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X DELETE 'https://app.onenotary.us/api/v2/webhooks/{webhook_id}' \
            --header 'Accept: application/json' \
            --header 'X-ONENOTARY-API-TOKEN: {Business Account Token}'
      tags:
        - Webhook
      summary: Remove Webhook
      parameters:
        - $ref: '#/components/parameters/webhook_id'
      responses:
        '204':
          description: Successful operation
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
  /shortcuts/all_in_one:
    post:
      operationId: allInOne
      security:
        - Token: []
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST 'https://app.onenotary.us/api/v2/shortcuts/all_in_one' \
            --header 'Accept: application/json' \
            --header 'X-ONENOTARY-API-TOKEN: {Business Account Token}' \
            --header 'Content-Type: application/json' \
            --data-raw '{"participants": [{"email": "user@example.com","role": "primary_signer"}]}'
      tags:
        - Shortcuts (Beta)
      summary: All In One
      description: Creates and inits new notarization session.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AllInOneRequest'
                - $ref: '#/components/schemas/AllInOneRequestExtended'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AllInOneResponse'
                  - $ref: '#/components/schemas/AllInOneResponseExtended'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
  /notary:
    put:
      operationId: updateNotary
      security:
        - Token: []
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST 'https://app.onenotary.us/api/v2/notary' \
            --header 'Accept: application/json' \
            --header 'X-ONENOTARY-API-TOKEN: {Business Account Token}' \
            --header 'Content-Type: application/json' \
            --data-raw '{"email": "notary@onenotary.us", "external_id": "5fb80251-ce49-4786-91a8-9aa6a801fd2d"}'
      tags:
        - Notary
      summary: Onboard Notary (Partner API)
      description: Update Notary by providing external partner id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                external_id:
                  type: string
              required:
                - email
                - external_id
      responses:
        '200':
          description: Successful operation
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
components:
  securitySchemes:
    Token:
      type: apiKey
      in: header
      name: X-ONENOTARY-API-TOKEN
  schemas:
    id:
      type: string
      format: uuid
      example: d47766d8-5ffa-444f-bb7a-476ffbdce85d
    external_id:
      type: string
      description: <b>Optional</b> External Id. Used for integration.
    SessionResponseBase:
      type: object
      description: Session
      properties:
        id:
          $ref: '#/components/schemas/id'
        external_id:
          $ref: '#/components/schemas/external_id'
    status:
      type: string
      enum:
        - created
        - create_expired
        - invite_sent
        - invite_expired
        - invite_canceled
        - canceled
        - draft
        - draft_expired
        - identity_check
        - identity_locked
        - identity_required
        - identity_expired
        - id_verification_started
        - payments
        - payments_expired
        - pending
        - pending_expired
        - ready_to_start
        - ready_to_start_expired
        - session_started
        - session_expired
        - session_terminated
        - additional_information_required
        - additional_information_required_expired
        - processing
        - processing_document_failed
        - processing_video_failed
        - processing_terminated
        - completing
        - completed_payment_failed
        - completed_document_delivery_failed
        - completed_successfully
    created_at:
      type: string
      format: date-time
      description: The UTC datetime (ISO 8601) for when current session was initialized
      example: '2020-07-13T16:30:00+00:00'
    price:
      type: number
      format: double
      example: 0
      description: Current session total payment ($)
    SessionResponse:
      allOf:
        - $ref: '#/components/schemas/SessionResponseBase'
        - type: object
          properties:
            status:
              $ref: '#/components/schemas/status'
            created_at:
              $ref: '#/components/schemas/created_at'
            price:
              $ref: '#/components/schemas/price'
    schedule_at:
      type: string
      format: date-time
      description: <b>Optional</b> The UTC datetime (ISO 8601) for when current session is scheduled
      example: '2020-07-13T16:30:00+00:00'
    business_scenario:
      type: string
      enum:
        - i9
        - ps1583
      description: <b>Optional</b> Custom business flow
      example: i9
    session_type:
      type: string
      enum:
        - ron
        - travel_paper
        - ipen
      description: |
        <b>Optional</b> Notarization type.<code>ron</code> — remote online notarization.<code>travel_paper</code> — in-person notarization on paper.<code>ipen</code> — in-person electronic notarization.<br> <b>Deprecated:</b> <code>mobile_paper</code> is still accepted for backward compatibility — please use <code>travel_paper</code> instead. <code>mobile_ipen</code> is still accepted for backward compatibility — please use <code>ipen</code> instead.
      example: travel_paper
      default: ron
    Custom:
      type: array
      description: <b>Optional</b> Custom key-value data connected to session. Could be used for integration.
      items:
        type: object
        properties:
          key:
            type: string
            example: custom_example_key
          value:
            type: string
            example: custom_example_value
    SessionResponseExtended:
      allOf:
        - $ref: '#/components/schemas/SessionResponse'
        - type: object
          properties:
            schedule_at:
              $ref: '#/components/schemas/schedule_at'
            business_scenario:
              $ref: '#/components/schemas/business_scenario'
            session_type:
              $ref: '#/components/schemas/session_type'
            custom:
              $ref: '#/components/schemas/Custom'
    error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
    SessionRequest:
      type: object
      nullable: true
    language:
      type: string
      enum:
        - EN
        - ES
      description: <b>Optional</b> Language of a notarization session (please contact support if you want to use it)
      example: EN
    us_state:
      type: string
      enum:
        - FL
        - VA
        - PA
        - TX
      description: <b>Optional</b> US state of a notarization session (please contact support if you want to use it)
      example: VA
    idv_pre_setup:
      type: string
      enum:
        - kba
        - biometric
        - kba_or_biometric
        - kba_and_biometric
      description: <b>Optional</b> Identity Verification method(s) that will be available to the participant during the session preparation
      example: kba
    SessionRequestExtended:
      type: object
      properties:
        external_id:
          $ref: '#/components/schemas/external_id'
        schedule_at:
          $ref: '#/components/schemas/schedule_at'
        business_scenario:
          $ref: '#/components/schemas/business_scenario'
        session_type:
          $ref: '#/components/schemas/session_type'
        language:
          $ref: '#/components/schemas/language'
        us_state:
          $ref: '#/components/schemas/us_state'
        idv_pre_setup:
          $ref: '#/components/schemas/idv_pre_setup'
        custom:
          $ref: '#/components/schemas/Custom'
    ParticipantResponseBase:
      type: object
      properties:
        id:
          type: integer
          format: integer
          example: 777
      required:
        - id
    Participant:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    explicit_role:
      type: string
      enum:
        - primary_signer
        - signer
        - witness
      title: role
      description: |
        Session status:
         * `primary_signer`
         * `signer`
         * `witness`
    ParticipantRequest:
      title: ParticipantRequest
      allOf:
        - $ref: '#/components/schemas/Participant'
        - type: object
          properties:
            role:
              $ref: '#/components/schemas/explicit_role'
          required:
            - email
            - role
    ParticipantInvitation:
      type: object
      properties:
        link:
          type: string
          format: link
          description: 'Note: link is available in case session is already initiated'
          example: https://app.onenotary.us/.........
    ParticipantResponse:
      title: ParticipantResponse
      allOf:
        - $ref: '#/components/schemas/ParticipantResponseBase'
        - $ref: '#/components/schemas/ParticipantRequest'
        - $ref: '#/components/schemas/ParticipantInvitation'
    address:
      type: object
      properties:
        country:
          type: string
          format: Two-letter country code in alpha-2 format
          example: US
          description: By default, the country code will be interpreted as the United States (US)
        state:
          type: string
          format: Two-letter abbreviation for United States and Canada
          example: CA
          description: For United States and Canada it is two-letter state and territory abbreviation. For other countries any relevant regional information
        city:
          type: string
          example: SF
        street:
          type: string
          example: Freemont 399
        zip:
          type: string
          format: 5-digit or the 9-digit format for United States
          example: '55555'
          description: For United States it is the 5-digit or the 9-digit format. For other countries any relevant information
    requests_Custom:
      title: Custom
      type: array
      description: Custom key-value data connected to participant.<br> Predefined keys:<br> <ul> <li> <b>signer_redirection_url</b> - The URL to which the signer will be redirected after the completion of the session. </li> </ul>
      items:
        type: object
        properties:
          key:
            type: string
            example: custom_example_key
          value:
            type: string
            example: custom_example_value
      example:
        - key: signer_redirection_url
          value: https://example.com
        - key: custom_example_key
          value: custom_example_value
    Extended:
      type: object
      properties:
        external_id:
          type: string
          example: d47766d8-5ffa-444f-bb7a-476ffbdce85d
        phone_number:
          type: string
          example: +1 (234) 567-89-01
          description: 'Note: available only for primary_signer'
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        middle_name:
          type: string
          example: W
        date_of_birth:
          type: string
          example: 02/13/1987
          description: Format dd/mm/yyyy
        address:
          $ref: '#/components/schemas/address'
          description: Used to pre-populate signers data.
        custom:
          $ref: '#/components/schemas/requests_Custom'
    ParticipantRequestExtended:
      title: ParticipantRequestExtended
      allOf:
        - $ref: '#/components/schemas/ParticipantRequest'
        - type: object
          properties:
            role:
              $ref: '#/components/schemas/explicit_role'
          required:
            - email
            - role
        - $ref: '#/components/schemas/Extended'
    ParticipantResponseExtended:
      title: ParticipantResponseExtended
      allOf:
        - $ref: '#/components/schemas/ParticipantResponseBase'
        - $ref: '#/components/schemas/ParticipantRequestExtended'
        - $ref: '#/components/schemas/ParticipantInvitation'
    WitnessResponse:
      title: WitnessResponse
      allOf:
        - $ref: '#/components/schemas/ParticipantResponseBase'
    NotaryResponseBase:
      type: object
      properties:
        id:
          type: integer
          format: integer
          example: 777
        user_id:
          type: string
          format: uuid
          example: 365075b6-865a-4d42-9605-6705833baf23
          description: <b>Optional</b> Internal User Id.
      required:
        - id
    NotaryResponse:
      allOf:
        - $ref: '#/components/schemas/NotaryResponseBase'
        - type: object
          properties:
            email:
              type: string
              format: email
              description: '<b>Optional</b> Note: available only if notary was set via API'
            full_name:
              type: string
              example: Online Notary
              description: '<b>Optional</b> Note: available only after session init'
    Commission:
      type: object
      description: Commission info
      properties:
        number:
          type: string
          description: <b>Optional</b> Commission number
          example: '12345'
        state:
          type: string
          description: Commission state
          example: NY
        county:
          type: string
          description: <b>Optional</b> Commission county
        expiration_date:
          type: date
          description: 'Commission expiration date. Format: YYYY-MM-DD'
          example: '2023-10-20'
    Seal:
      type: object
      description: Seal info
      properties:
        base64_content:
          type: string
          format: Base64
          description: Base64 string
    NotaryResponseExtended:
      allOf:
        - $ref: '#/components/schemas/NotaryResponse'
        - type: object
          properties:
            phone_number:
              type: string
              description: International phone number
              example: '+12124567890'
            commission:
              allOf:
                - $ref: '#/components/schemas/Commission'
            seal:
              allOf:
                - $ref: '#/components/schemas/Seal'
    DocumentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: form-ds3053.pdf
        size:
          type: integer
          format: int32
          description: The size of the Document in bytes.
        created_at:
          type: string
          format: date-time
          description: The UTC datetime (ISO 8601) for when current document was uploaded
          example: '2020-07-13T16:30:00+00:00'
        type:
          type: string
          enum:
            - original
            - signed
          description: |
            Document type:
             * `original` - Original document
             * `signed` - Final (signed) document
        subtype:
          type: string
          enum:
            - photo_id_document
            - address_id_document
          description: |
            <b>Optional</b> Document subtype:
             * `photo_id_document` - Primary ID with a photo
             * `address_id_document` - Secondary ID with a home address
    DocumentStampResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        service_type:
          type: string
          enum:
            - acknowledgment
            - jurat
            - oath
          description: |
            Service type to which the stamp is applied
        page:
          type: integer
          format: int32
          example: 1
          description: Number of the page on which the stamp is placed.
    VideoResponse:
      properties:
        id:
          type: string
          format: uuid
          example: d47766d8-5ffa-444f-bb7a-476ffbdce85d
        url:
          type: string
          format: link
          example: https://....../.........
        expires_at:
          type: string
          format: date-time
          description: The UTC datetime (ISO 8601) when current video url will expire
          example: '2020-07-13T16:30:00+00:00'
    PersonalInfoRequest:
      type: object
      properties:
        external_id:
          type: string
          example: d47766d8-5ffa-444f-bb7a-476ffbdce85d
        full_name:
          type: string
          example: John Doe
        date_of_birth:
          type: string
          example: 02/13/1987
          description: <b>Optional</b> Format dd/mm/yyyy
        address:
          $ref: '#/components/schemas/address'
      required:
        - external_id
        - full_name
        - address
    KBAInfoRequest:
      type: object
      properties:
        transaction_id:
          type: string
          example: d47766d8-5ffa-444f-bb7a-476ffbdce85d
        result:
          type: string
          enum:
            - success
            - error
        error:
          type: string
          description: <b>Required if result == error</b>
          enum:
            - lack_of_data
            - configuration_error
            - person_not_found
            - not_eligible_to_proceed
            - timeout
            - incorrect_answers
      required:
        - transaction_id
        - result
        - error
    IDVInfoRequest:
      type: object
      properties:
        transaction_id:
          type: string
          example: d47766d8-5ffa-444f-bb7a-476ffbdce85d
        result:
          type: string
          enum:
            - not_approved
            - approved
        error:
          type: string
          description: <b>Required if result == not_approved</b>
          enum:
            - blurred
            - bad_quality
            - missing_part_document
            - hidden_part_document
            - damaged_document
            - glare
            - missing_mandatory_datapoints
            - missing_front
            - missing_back
            - cannot_be_used
            - generic_verification_error
            - network_error
            - timeout_error
            - camera_error
            - biometric_failed
            - secondary_document_same_as_first
            - no_documents_submitted
        document_type:
          type: string
          example: passport|drivers_licence
        title:
          type: string
          example: 'DRIVING_LICENSE: REGULAR_DRIVING_LICENSE|ID_CARD: NATIONAL_ID'
        document_number:
          type: string
          example: AA123456
        front_image:
          type: string
          format: byte
          description: Base64 file content. <b>Required if result == approved</b>
          example: JVBERi0xLjUNCiW1tbW1DQoxIDAg......
        back_image:
          type: string
          format: byte
          description: Base64 file content
          example: JVBERi0xLjUNCiW1tbW1DQoxIDAg......
        issue_date:
          type: string
          example: 02/13/1987
          description: Format dd/mm/yyyy
        expiration_date:
          type: string
          example: 02/13/2028
          description: Format dd/mm/yyyy
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        country:
          type: string
          example: US
        state:
          type: string
          example: CA
        city:
          type: string
          example: SF
        street:
          type: string
          example: Freemont 399
        zip:
          type: string
          example: '55555'
        date_of_birth:
          type: string
          example: 02/13/1987
          description: Format dd/mm/yyyy
      required:
        - transaction_id
        - result
        - document_type
        - front_image
        - error
    session-status-updated:
      type: string
      title: Session Status Updated (Generic)
      description: |
        A generic event triggered every time the session `status` changes.
        The payload contains the full session object with the new status.
      enum:
        - session.status.updated
    session-status-updated-to-specific:
      type: string
      title: Session Status Updated (Specific)
      description: |
        An event triggered when the session `status` changes to a specific value.
        Suffix the event name with the desired status name.

        For example, subscribe to `session.status.updated_completed_successfully` to be notified only when the session is successfully completed.
      enum:
        - session.status.updated_created
        - session.status.updated_create_expired
        - session.status.updated_invite_sent
        - session.status.updated_invite_expired
        - session.status.updated_invite_canceled
        - session.status.updated_canceled
        - session.status.updated_draft
        - session.status.updated_draft_expired
        - session.status.updated_identity_check
        - session.status.updated_identity_verification_failed
        - session.status.updated_identity_locked
        - session.status.updated_identity_required
        - session.status.updated_identity_expired
        - session.status.updated_id_verification_started
        - session.status.updated_id_verification_failed
        - session.status.updated_id_verification_link_sent
        - session.status.updated_id_verification_images_submitted
        - session.status.updated_payments
        - session.status.updated_payments_expired
        - session.status.updated_pending
        - session.status.updated_pending_expired
        - session.status.updated_ready_to_start
        - session.status.updated_ready_to_start_expired
        - session.status.updated_session_started
        - session.status.updated_session_expired
        - session.status.updated_session_running_expired
        - session.status.updated_session_terminated
        - session.status.updated_processing
        - session.status.updated_processing_document_failed
        - session.status.updated_processing_video_failed
        - session.status.updated_processing_terminated
        - session.status.updated_completing
        - session.status.updated_completed_payment_failed
        - session.status.updated_completed_document_delivery_failed
        - session.status.updated_completed_successfully
        - session.status.updated_additional_information_required
        - session.status.updated_additional_information_required_expired
    notary-changed:
      type: string
      title: Notary Assignment Updated
      description: |
        Triggered when a notary is either assigned to or removed from a session.
      enum:
        - session.updated_notary_assigned
        - session.updated_notary_removed
    signer-lock:
      type: string
      title: Signer Identity Lock Updated
      description: |
        Triggered when a signer's identity is locked (e.g., due to failed KBA/IDV) or a signer's identity lock has been lifted.
      enum:
        - session.updated_signer_identity_locked
        - session.updated_signer_identity_unlocked
    session-pause-av-issue:
      type: string
      title: Session Paused With Audio-Video Issue
      enum:
        - session.updated_paused_audio_video_issue
    session-pause-document-issue:
      type: string
      title: Session Paused With Document Issue
      enum:
        - session.updated_paused_document_issue
    session-pause-notary-change:
      type: string
      title: Session Paused To Change a Notary
      enum:
        - session.updated_paused_notary_change
    session-pause-notary-not-on-session:
      type: string
      title: Session Paused With Notary Not On Session Issue
      enum:
        - session.updated_paused_notary_not_on_session
    session-pause-participants-inactivity:
      type: string
      title: Session Paused Due to Participants Becoming Inactive
      enum:
        - session.updated_paused_inactive_participants
    session-pause-signer-exit-other-reason:
      type: string
