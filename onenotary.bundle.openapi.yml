              $ref: '#/components/schemas/SignerExitOtherReasonObject'
    DetailsInactiveParticipantsObject:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    SessionPauseParticipantsInactivityObject:
      type: object
      properties:
        notary:
          $ref: '#/components/schemas/NotaryResponseBase'
        pause_details:
          $ref: '#/components/schemas/DetailsInactiveParticipantsObject'
    SessionPauseParticipantsInactivity:
      allOf:
        - $ref: '#/components/schemas/SessionUpdatedObject'
        - type: object
          properties:
            type:
              $ref: '#/components/schemas/session-pause-participants-inactivity'
            data:
              $ref: '#/components/schemas/SessionPauseParticipantsInactivityObject'
    DetailsOtherReasonObject:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    SessionPauseOtherReasonObject:
      type: object
      properties:
        notary:
          $ref: '#/components/schemas/NotaryResponseBase'
