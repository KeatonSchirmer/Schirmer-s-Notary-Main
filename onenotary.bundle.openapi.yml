          type: string
          format: date-time
          description: The UTC datetime (ISO 8601) for when current event was occurred
    SessionStatusUpdatedObject:
      allOf:
        - $ref: '#/components/schemas/EventObject'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SessionResponse'
    SessionStatusUpdated:
      allOf:
        - type: object
          properties:
            type:
              $ref: '#/components/schemas/session-status-updated'
        - $ref: '#/components/schemas/SessionStatusUpdatedObject'
    SessionStatusUpdatedToSpecific:
      allOf:
        - type: object
          properties:
