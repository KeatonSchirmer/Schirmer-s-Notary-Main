paths:
  /sessions:
    post:
      operationId: createSession
      security:
        - Token: []
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST 'https://app.onenotary.us/api/v2/sessions' \
            --header 'Accept: application/json' \
            --header 'X-ONENOTARY-API-TOKEN: {Business Account Token}' \
            --header 'Content-Type: application/json'
      tags:
        - Session
      summary: Create session
      description: Creates new notarization session. Session ID from response will be used in all next API methods.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SessionRequest'
                - $ref: '#/components/schemas/SessionRequestExtended'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionResponse'
                  - $ref: '#/components/schemas/SessionResponseExtended'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
    get:
      operationId: getSessions
      security:
        - Token: []
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X GET 'https://app.onenotary.us/api/v2/sessions' \
            --header 'Accept: application/json' \
            --header 'X-ONENOTARY-API-TOKEN: {Business Account Token}' \
            --header 'Content-Type: application/json'
      tags:
        - Session
      summary: List of Sessions
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/SessionResponse'
                    - $ref: '#/components/schemas/SessionResponseExtended'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
  /sessions/{session_id}:
    get:
      operationId: getSession
      security:
        - Token: []
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X GET 'https://app.onenotary.us/api/v2/sessions/{session_id}' \
            --header 'Accept: application/json' \
            --header 'X-ONENOTARY-API-TOKEN: {Business Account Token}'
            --header 'Content-Type: application/json'
      tags:
        - Session
      summary: Get session info
      parameters:
        - $ref: '#/components/parameters/session_id'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionResponse'
                  - $ref: '#/components/schemas/SessionResponseExtended'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
  /sessions/{session_id}/init:
    post:
      operationId: initSession
      security:
        - Token: []
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST 'https://app.onenotary.us/api/v2/sessions{session_id}/init' \
            --header 'Accept: application/json' \
            --header 'X-ONENOTARY-API-TOKEN: {Business Account Token}' \
            --header 'Content-Type: application/json'
      tags:
        - Session
      summary: Init session
      parameters:
        - $ref: '#/components/parameters/session_id'
      description: |
        Depending on your business account config this API method will either:
          - send invitation emails to all participants or
          - send a session to notary review
          - if you are using the embedded integration, you have the option to disable the sending of invitation emails.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                send_email:
                  type: boolean
                  default: true
                  example: true
                  description: <b>Optional</b>
      responses:
        '201':
          description: Successful operation
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
  /sessions/{session_id}/cancel:
    post:
      operationId: cancelSession
      security:
        - Token: []
      x-codeSamples:
        - lang: cURL
          source: |
            curl -X POST 'https://app.onenotary.us/api/v2/sessions{session_id}/cancel' \
            --header 'Accept: application/json' \
            --header 'X-ONENOTARY-API-TOKEN: {Business Account Token}' \
            --header 'Content-Type: application/json'
      tags:
        - Session
      summary: Cancel session
      parameters:
        - $ref: '#/components/parameters/session_id'
      description: |+
        Cancels the session if it hasn't started

      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionResponse'
                  - $ref: '#/components/schemas/SessionResponseExtended'
              example:
                id: d47766d8-5ffa-444f-bb7a-476ffbdce85d
                status: canceled
                created_at: '2020-07-13T16:30:00+00:00'
                price: 25
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
