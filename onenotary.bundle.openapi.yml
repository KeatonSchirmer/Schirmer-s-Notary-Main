info:
  description: |
    # About

    Our mission is to create convenience for our customers through
    the fastest online notary service, available anytime.
    We want to improve the notarization process by streamlining it,
    making it affordable, and accessible to everyone.


    <br>
    <a href="https://onenotary.us/onenotary-business-online-demo"><img src="https://one-notary-prod-public.s3.amazonaws.com/NeedWL.png" alt="OneNotary Business Demo" /></a>

    # General flow

    <img src="https://one-notary-prod-public.s3.amazonaws.com/ONT_Generic.png" />


    # Getting Started

    ## Create a Business Account

    1. Sign Up to Business Account [Business Sign Up page](https://app.onenotary.us/business/signup/).

    2. Contact support@onenotary.us for initial setup

    # Incoming Webhooks

    OneNotary uses webhooks to notify your application when events happen in your account. Webhooks are especially useful for asynchronous events like session status changes, notary assignments, or technical issues during a live session.

    ## Webhooks vs. Session Statuses

    It is crucial to distinguish between **Webhook Event Types** and **Session Statuses**:

    *   **Webhook Event Types**: These are the triggers you subscribe to (e.g., `session.status.updated` or `session.status.updated_completed_successfully`). They define *when* a callback is sent to your server.
    *   **Session Statuses**: These represent the current state of a session (e.g., `created`, `ready_to_start`, `completed_successfully`). The current status is always present in the `status` field of the session object within the webhook payload.

    ## Event Categories

    OneNotary triggers events across several categories:

    ### 1. Session Status Updates

    These events are triggered when a session's primary state changes. You can subscribe to the generic `session.status.updated` event to receive all updates, or to specific events (e.g., `session.status.updated_completed_successfully`) to filter for only the states you care about.

    #### Status Lifecycle Reference

    Below is a list of available statuses. To subscribe to a specific status change, prefix the status name with `session.status.updated_`.

     | Phase            | Status                                    | Description                                                                                                                                                                                                                |
     | :---             | :---                                      | :---                                                                                                                                                                                                                       |
     | **Initiation**   | created                                 | The requester (business or individual) has created a request but hasn't invited participants yet. This request may have a document uploaded, a list of participants who will be invited later, and payment method details. |
     |                  | create_expired                          | Request expired after 30 days of inactivity.                                                                                                                                                                               |
     |                  | invite_sent                             | The requester has initiated an invite to participants (signers and witnesses). All participants have received emails with a join link.                                                                                     |
     |                  | invite_expired                          | Not all participants have proceeded with the invitation, and therefore the invitation has expired within 30 days.                                                                                                          |
     |                  | invite_canceled                         | Invitation was canceled.                                                                                                                                                                                                   |
     |                  | canceled                                | Request was canceled by backoffice or API.                                                                                                                                                                                 |
     | **Preparation**  | draft                                   | All participants have reached at least the “Documents” page.                                                                                                                                                               |
     |                  | draft_expired                           | All participants have reached at least the 'Documents' page and have abandoned the request for more than 30 days.                                                                                                          |
     |                  | identity_check                          | All participants have reached at least the “Identity Check” page.                                                                                                                                                          |
     |                  | identity_locked                         | The request is locked for 24 hours due to unsuccessful identity verification.                                                                                                                                              |
     |                  | identity_required                       | At least one participant needs to start identity verification.                                                                                                                                                              |
     |                  | identity_expired                        | All participants have reached at least the 'Identity Check' page and have abandoned the request for more than 30 days.                                                                                                     |
     |                  | id_verification_started                 | All participants have reached at least the 'Photo ID Verification' page.                                                                                                                                                   |
     |                  | payments                                | The paying agent (requestor or primary signer) has reached the payment stage.                                                                                                                                              |
     |                  | payments_expired                        | The paying agent (requestor or primary signer) has reached the payment stage and has abandoned the request for more than 30 days.                                                                                          |
     | **Live Session** | pending                                 | The notary session has been paused, all issues resolved and waiting for the signer to re-initiate the notary search.                                                                                                       |
     |                  | pending_expired                         | The notary session has been paused and none has re-initiated the session recovery for more than 30 days.                                                                                                                   |
     |                  | ready_to_start                          | All participants have performed A/V check and identity verification and are waiting for the notary to start the session.                                                                                                   |
     |                  | ready_to_start_expired                  | The 'Ready to Start' session hasn't started within 30 days                                                                                                                                                                 |
     |                  | session_started                         | The 'Ready to Start' session has started. The notary and all the participants have joined the session.                                                                                                                     |
     |                  | session_expired                         | The session was abandoned for more than 30 days.                                                                                                                                                                           |
     |                  | session_terminated                      | The session was stopped either by the notary or by any other participant. There was no way to pause the session to recover it later.                                                                                       |
     |                  | additional_information_required         | The session is paused and waiting for input from participants.                                                                                                                                                             |
     |                  | additional_information_required_expired | The session was paused to get input from participants. Didn’t get input within 30 days.                                                                                                                                    |
     | **Post-Session** | processing                              | The notary has completed the session. OneNotary is processing the session documents and video.                                                                                                                             |
     |                  | processing_document_failed              | The notary has completed the session. There is a problem with the documents.                                                                                                                                               |
     |                  | processing_video_failed                 | The notary has completed the session. There is a problem with the video.                                                                                                                                                   |
     |                  | processing_terminated                   | The notary has completed the session but video or document processing was not finished.                                                                                                                             |
     |                  | completing                              | The notary has completed the session. The session documents and video are ready. OneNotary performs the payment transaction and delivers emails or documents to the recipients.                                            |
     |                  | completed_payment_failed                | The payment for the notary session has failed. The paying agent will receive a notification about the failed transaction. The document recipient is blocked from downloading the document.                                 |
     |                  | completed_document_delivery_failed      | The document was not delivered to the recipient.                                                                                                                                                                           |
     |                  | completed_successfully                  | The session is completed successfully. Documents and videos are ready for download.                                                                                                                                        |



    > For more details on each event, please refer to the [Subscribe to events](#operation/subscribeWebhook) operation.

    ### 2. Session Property Updates

    These events occur when specific attributes change, regardless of the overall session status.

    | Event | Description |
    | :--- | :--- |
    | `session.updated_notary_assigned` | A notary has been assigned to the session. |
    | `session.updated_notary_removed` | The assigned notary has been removed from the session. |
    | `session.updated_signer_identity_locked` | A signer is temporarily locked (24h) due to failed identity verification. |
    | `session.updated_signer_identity_unlocked` | A signer's identity lock has been lifted. |

    ### 3. Session Pause Events

    These events provide detailed context when a live session is paused.

    | Initiator of Pause | Event | Reason for Pausing |
    | :---  | :--- | :--- |
    | `notary` | `session.updated_paused_audio_video_issue` | One or more participants are experiencing technical difficulties. |
    | `notary` | `session.updated_paused_document_issue` | There is an issue with the session documents |
    | `notary` | `session.updated_paused_notary_change` | Signer requires a notary from a different state or language. |
    | `notary` | `session.updated_paused_other_reason` | The session was paused for a specified reason. |
    | `signer` | `session.updated_paused_notary_not_on_session` | The assigned notary is not present in the session. |
    | `signer` | `session.updated_paused_signer_exit_other_reason` | A signer couldn't or didn't want to continue the session with a provided reason |
    | `system` | `session.updated_paused_inactive_participants` | All required participants became inactive or disconnected. |

    ## Event Payload Structure

    All webhook notifications follow a consistent structure. Most events return the full [Session object](#tag/session_model) in the `data` field, while specialized events (like property updates or pauses) return targeted information.

    | Field | Type | Description |
    | :--- | :--- | :--- |
    | `type` | string | The specific event type (e.g., `session.status.updated`). |
    | `event_created_at` | string | ISO 8601 timestamp of when the event occurred. |
    | `data` | object | The event data. For status updates, this is the full Session object. |

    ### Example Payload

    ```json
    {
      "type": "session.status.updated_completed_successfully",
      "event_created_at": "2024-01-12T16:30:00.000Z",
      "data": {
        "id": "d47766d8-5ffa-444f-bb7a-476ffbdce85d",
        "status": "completed_successfully",
        "external_id": "YOUR_ID",
        "price": 25.0,
        "created_at": "2024-01-12T16:00:00.000Z"
      }
    }
    ```

    ## Handling Strategies

    *   **State Sync**: Subscribe to `session.status.updated` to keep your local database in sync with OneNotary.
    *   **Automation**: Use specific events like `session.status.updated_completed_successfully` to trigger post-session workflows.
    *   **Support**: Monitor `session.updated_paused_audio_video_issue` to proactively help users with technical problems.

    ## Webhook Signatures

    To ensure security, OneNotary signs every webhook request. You should verify these signatures to confirm that the request originated from OneNotary.

    The `X-Onenotary-Signature` header contains a timestamp and a signature:
    `X-Onenotary-Signature: t=1644488446795,s=89f655a6a287b6d1b104d432d3dc67afba5c7f466ac1da4748aa7ef7f701bf16`

    ### Verification Steps

    1.  **Extract**: Parse the header to get the timestamp `t` and signature `s`.
    2.  **Prepare**: Concatenate the timestamp, a dot `.`, and the raw JSON request body string.
    3.  **Sign**: Compute an HMAC SHA256 hex-encoded signature using your **API Token** as the secret key.
    4.  **Compare**: The computed signature must match the one from the header.

    #### Python Implementation

    ```python
    import hmac
    import hashlib

    def verify_signature(header, body, api_token):
        # 1. Extract t and s
        parts = dict(x.split('=') for x in header.split(','))
        t, s = parts.get('t'), parts.get('s')
        
        # 2 & 3. Prepare and Sign
        payload = f"{t}.{body}"
        expected = hmac.new(api_token.encode(), payload.encode(), hashlib.sha256).hexdigest()
        
        # 4. Compare
        return hmac.compare_digest(expected, s)
    ```

    # Deprecation

    The following API parameter values are deprecated. They remain supported until the dates listed in the table below, after which they will be removed.
    Please update your integrations accordingly.

    `session_type` (POST /api/v2/sessions/)

    | Deprecated value | Replacement | Supported until |
    | :--- | :--- | :--- |
    | `mobile_paper` | `travel_paper` | End of 2026 |
    | `mobile_ipen` | `ipen` | End of 2026 |
