      allOf:
        - $ref: '#/components/schemas/SessionRequest'
        - type: object
          properties:
            participants:
              type: array
              items:
                $ref: '#/components/schemas/Participant'
    implicit_role:
      type: string
      enum:
        - primary_signer
        - signer
        - witness
      title: role
      description: |
        <b>Optional</b> Session status:
         * `primary_signer`
         * `signer`
         * `witness`

        Note: role must be explicitly defined or undefined for all participants
    ParticipantExtended:
      allOf:
        - $ref: '#/components/schemas/Participant'
        - type: object
          properties:
            role:
              $ref: '#/components/schemas/implicit_role'
        - $ref: '#/components/schemas/Extended'
    DocumentNameRequest:
      type: object
      properties:
        name:
          type: string
          example: form-ds3053.pdf
    client:
      type: object
      description: <b>Optional</b> Data for the sub-account associated with the notarization session. Used for integration.
      properties:
        external_id:
          type: string
          description: Client External Id
        name:
          type: string
          description: Client Name
    AllInOneRequestExtended:
      type: object
      properties:
        external_id:
          $ref: '#/components/schemas/external_id'
        business_scenario:
          $ref: '#/components/schemas/business_scenario'
        language:
          $ref: '#/components/schemas/language'
        us_state:
          $ref: '#/components/schemas/us_state'
        custom:
          $ref: '#/components/schemas/Custom'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantExtended'
        documents:
          description: <b>Optional</b> The document name is used in integration.
          type: array
          items:
            $ref: '#/components/schemas/DocumentNameRequest'
        client:
          $ref: '#/components/schemas/client'
    AllInOneResponse:
      allOf:
        - $ref: '#/components/schemas/SessionResponse'
        - type: object
          properties:
            participants:
              type: array
              items:
                $ref: '#/components/schemas/ParticipantResponse'
    DocumentNameResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: form-ds3053.pdf
        created_at:
          type: string
          format: date-time
          description: The UTC datetime (ISO 8601) for when current document was uploaded
          example: '2020-07-13T16:30:00+00:00'
    AllInOneResponseExtended:
      type: object
      description: Session
      properties:
        id:
          $ref: '#/components/schemas/id'
        external_id:
          $ref: '#/components/schemas/external_id'
        status:
          $ref: '#/components/schemas/status'
        created_at:
          $ref: '#/components/schemas/created_at'
        price:
          $ref: '#/components/schemas/price'
        schedule_at:
          $ref: '#/components/schemas/schedule_at'
        business_scenario:
          $ref: '#/components/schemas/business_scenario'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantResponseExtended'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentNameResponse'
  responses:
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    '405':
      description: Method is not allowed
  parameters:
    session_id:
      name: session_id
      in: path
      description: Session ID
      required: true
      schema:
        type: string
        format: uuid
    participant_id:
      name: participant_id
      in: path
      description: Participant ID
      required: true
      schema:
        type: string
        format: integer
    document_id:
      name: document_id
      in: path
      description: Document ID
      required: true
      schema:
        type: string
        format: uuid
    webhook_id:
      name: webhook_id
      in: path
      description: Webhook ID
      required: true
      schema:
        type: integer
