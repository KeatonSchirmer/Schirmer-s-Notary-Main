      title: Session Paused With Other Reason
      enum:
        - session.updated_paused_other_reason
    session-terminate-with-reason:
      type: string
      title: Session Terminated
      description: |
        Triggered when a session is terminated. 
        This event provides additional `termination_details` in the payload compared to the generic status update.
      enum:
        - session.status.updated_session_terminated
