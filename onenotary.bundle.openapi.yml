    SessionPauseDocumentIssue:
      allOf:
        - $ref: '#/components/schemas/SessionUpdatedObject'
        - type: object
          properties:
            type:
              $ref: '#/components/schemas/session-pause-document-issue'
            data:
              $ref: '#/components/schemas/SessionPauseDocumentIssueObject'
    SessionPauseNotaryNotOnSessionObject:
      type: object
      properties:
        notary:
          $ref: '#/components/schemas/NotaryResponseBase'
    SessionPauseNotaryNotOnSession:
      allOf:
        - $ref: '#/components/schemas/SessionUpdatedObject'
        - type: object
          properties:
            type:
              $ref: '#/components/schemas/session-pause-notary-not-on-session'
            data:
              $ref: '#/components/schemas/SessionPauseNotaryNotOnSessionObject'
    SignerExitOtherReasonDetailsObject:
